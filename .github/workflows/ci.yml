name: CI

on:
  push:
    branches:
    - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: install dependencies
      run: python -m pip install -r requirements.txt

    - name: run lint
      run: flake8 .


  test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install dependencies
      run:  python -m pip install -r requirements.txt

    - name: run test
      run:  python -m pytest

  build:
    needs:
      - lint
      - test

    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          python-version: "3.12"

      - name: install dependencies
        run: python -m pip install -r requirements.txt

      - name: build app
        run: python -m compileall . 