name: CI

on:
  push:
    branches:
    - main
  
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ vars.APP_ENV }}
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install dependencies
      run:  python -m pip install -r requirements.txt

    - name: show environement
      run: echo "running in $APP_ENV"

    - name: Check secret
      run: |
        if [ -n "$DEMO_TOKEN" ]; then
          echo "Secret is available"
        else
          echo "Secret is missing"
          exit 1
        fi

    - name: show git information
      run: |
        echo "repository: ${{ github.repository }}"
        echo "ref: ${{ github.ref }}"
        echo "commit sha: ${{ github.sha }}"

    - name: run test
      run:  python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install dependencies
      run:  python -m pip install -r requirements.txt

    - name: build app
      run:  python -m compileall . 