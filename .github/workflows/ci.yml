name: CI

on:
  push:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install dependencies
      run:  python -m pip install -r requirements.txt

    - name: run test
      run:  python -m pytest

  build:
    steps:
      - name: build app
        run:  python -m compileall . 
